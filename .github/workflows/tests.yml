name: tests

on:
  push:
    branches: [main]
    # The game refresh (src/game_model/refresh.py) commits only these, several times a day; it checks
    # the serving database still builds before it pushes, and deploy-api.yml smoke-tests the result.
    paths-ignore:
      - data/raw/games/**
      - data/raw/injuries/**
      - data/processed/game_predictions.csv
      - data/processed/game_players.csv
      - data/processed/live_meta.json
  pull_request:

jobs:
  pipeline:
    name: Pipeline and models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Tests use the committed datasets and model only; they never call the NBA API.
      - name: Run tests
        run: pytest -q

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements*.txt

      # The pipeline requirements are needed to build the database the API serves.
      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements-dev.txt

      - name: Build the serving database
        run: python -m src.export_db

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The TypeScript API types must match the committed OpenAPI schema.
      - name: Check generated API types
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.ts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Builds without the API running: pages fetch their data at request time.
      - name: Build
        run: npm run build

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl -sf http://localhost:8000/api/v1/health
          curl -sf http://localhost:3000/mvp/2022-23 | grep -q "Joel Embiid"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Logs on failure
        if: failure()
        run: docker compose logs
