name: refresh games

# Keeps the injury report on the game predictor fresh: downloads the latest report, re-predicts the
# season in progress, and commits the data if it changed. Then deploy-api.yml rebuilds the API image,
# with its serving database, from the new data. (Pushes made with the workflow's own token don't start
# other workflows, so this one calls it directly.)
#
# Results and the schedule come from stats.nba.com, which refuses GitHub's servers, so this run skips
# them (--injuries-only). A scheduled task on a home PC refreshes those (scripts/install-refresh-task.ps1);
# src/game_model/refresh.py handles both publishing at once.
#
# GitHub runs scheduled workflows only from the default branch, can start them several minutes late,
# and disables them after 60 days without activity in the repository.

on:
  schedule:
    # UTC. During the season (Eastern = UTC-5 in winter, UTC-4 from March):
    #   15:17  ~10am ET  the day's first report
    #   18:17  ~1pm ET   midday report
    #   22:17  ~5pm ET   the report most teams have submitted by
    #   23:47  ~6:45pm ET just before the early games
    #   02:17  ~9pm ET   before the late West Coast games
    - cron: "17 15,18,22 * * *"
    - cron: "47 23 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time; a run that starts while another is going waits for it.
concurrency:
  group: refresh-games
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The injury report PDFs aren't committed (data/cache/ is ignored). Without this, every run would
      # download the whole season's reports again.
      - name: Restore downloaded injury reports
        uses: actions/cache@v6
        with:
          path: data/cache
          key: nba-cache-${{ github.run_id }}
          restore-keys: nba-cache-

      # Refresh, check the serving database still builds, commit if the games changed, push. If the home
      # PC's refresh pushed first, start again from its commit.
      - name: Refresh and publish the injury report
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          python -m src.game_model.refresh --push --injuries-only
          [ "$(git rev-parse HEAD)" != "$before" ] && echo "published=true" >> "$GITHUB_OUTPUT" || true

  deploy:
    needs: refresh
    if: needs.refresh.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-api.yml
