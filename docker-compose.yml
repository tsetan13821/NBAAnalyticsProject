# Run the whole app locally in Docker:  docker compose up --build
#   Web app:  http://localhost:3000
#   API docs: http://localhost:8000/docs
# If a port is taken, pick others:  WEB_PORT=3001 API_PORT=8001 docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      NBA_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
      NBA_CACHE_MAX_AGE: "3600"

  web:
    build: frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      # Server-side requests go straight to the api container over the Compose network.
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
