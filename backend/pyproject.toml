[project]
name = "nba-analytics-api"
version = "1.0.0"
description = "Read-only FastAPI service over the NBA Analytics serving database."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]
